<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberGenics – Five security worlds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --space:#050814; --frost:#EAF0FA; --muted:#94A3BF; --red:#E8261C; --line:color-mix(in srgb, var(--frost) 13%, transparent);
  --glass:color-mix(in srgb, var(--space) 60%, transparent);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --space:#050814; --frost:#EAF0FA; } }
:root[data-theme="dark"] { --space:#050814; --frost:#EAF0FA; }
*, *::before, *::after { box-sizing:inherit }
html { scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top, 0px) }
body { margin:0; background:var(--space); color:var(--frost); font-family:'Sora', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing:antialiased }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer }
button:focus-visible, a:focus-visible { outline:2px solid #6EA0FF; outline-offset:3px; border-radius:8px }
a { color:inherit }

.top { position:absolute; left:0; right:0; top:0; z-index:6; display:flex; align-items:center; gap:28px; padding:calc(env(safe-area-inset-top, 0px) + 24px) clamp(20px, 4vw, 56px) 0 }
.top img { width:118px; display:block }
.top nav { display:flex; gap:8px; margin-left:auto; font-size:15px }
.top nav a { text-decoration:none; padding:10px 18px; border-radius:999px; color:var(--muted) }
.top nav a[aria-current="page"] { color:var(--frost); background:color-mix(in srgb, #3D7BE8 22%, transparent); border:1px solid color-mix(in srgb, #6EA0FF 50%, transparent) }
.tour { font-size:14px; padding:10px 18px; border:1px solid var(--line); border-radius:999px }
.tour[aria-pressed="true"] { border-color:var(--red); background:color-mix(in srgb, var(--red) 18%, transparent) }

.hero { position:relative; height:100vh; min-height:720px; overflow:hidden }
#gl { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:pan-y }
.hud { position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top, 0px) + 96px); z-index:3; text-align:center; pointer-events:none; padding:0 20px }
.count { margin:0 0 8px; font-size:14px; color:var(--muted) }
.pname { margin:0; font-weight:300; font-size:clamp(40px, 6vw, 80px); letter-spacing:.42em; padding-left:.42em; line-height:1 }
.ptitle { margin:12px 0 26px; font-size:17px; color:var(--muted) }
.stats { display:flex; flex-wrap:wrap; justify-content:center; gap:16px 48px; margin:0 auto; max-width:1100px }
.stats div { text-align:left; min-width:110px }
.stats dt { font-size:12.5px; color:#8A98B4; margin-bottom:5px }
.stats dd { margin:0; font-size:16px }
.fade { transition:opacity .35s ease, filter .35s ease, transform .5s cubic-bezier(.2,.8,.2,1) }
.fade.out { opacity:0; filter:blur(6px); transform:translateY(8px) }

.side { position:absolute; top:58%; z-index:4; transform:translateY(-50%); padding:18px 10px; display:flex; align-items:center; gap:14px; font-size:20px; font-weight:300; letter-spacing:.3em; color:var(--frost); transition:opacity .4s ease }
.side.left { left:clamp(64px, 9vw, 150px) }
.side.right { right:clamp(64px, 9vw, 150px); padding-right:0 }
.side svg { width:22px; height:22px; flex:none; opacity:.7 }
.side:hover svg { opacity:1 }
.moons { position:absolute; inset:0; z-index:3; pointer-events:none }
.moon { position:absolute; left:0; top:0; font-size:13px; color:#C9D3E6; white-space:nowrap; transition:opacity .4s ease; padding:4px 10px; border-radius:999px; background:var(--glass); border:1px solid var(--line) }
.pager { position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom, 0px) + 70px); z-index:4; display:flex; justify-content:center; flex-wrap:wrap; gap:8px; padding:0 16px }
.pager button { min-height:44px; padding:10px 18px; border-radius:999px; font-size:14px; color:var(--muted); border:1px solid var(--line); transition:all .35s ease }
.pager button[aria-current="true"] { background:var(--frost); color:var(--space); border-color:var(--frost) }
.cue { position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 24px); transform:translateX(-50%); z-index:4; font-size:13px; color:var(--muted); text-decoration:none }

.details { max-width:1200px; margin:0 auto; padding:80px clamp(20px, 4vw, 56px) 40px; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:64px }
.details h2 { margin:0 0 14px; font-weight:300; font-size:34px }
.details p { margin:0 0 26px; color:var(--muted); line-height:1.6; max-width:46ch }
.steps { list-style:none; margin:0; padding:0 }
.steps li { display:flex; gap:18px; align-items:flex-start; padding:14px 0; border-top:1px solid var(--line); font-size:17px; line-height:1.4 }
.steps b { flex:none; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:400; font-size:14px; border:2px solid var(--red) }
.steps span { padding-top:6px }
.sols { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:0 28px }
.sols li { display:flex; gap:12px; align-items:center; padding:13px 0; border-top:1px solid var(--line); font-size:15px; line-height:1.35; animation:rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i, 0) * 45ms) }
.sols i { flex:none; width:10px; height:10px; border-radius:50%; background:var(--dot, #6EA0FF); box-shadow:0 0 10px var(--dot, #6EA0FF) }
@keyframes rise { from { opacity:0; transform:translateY(10px) } }
.managed { max-width:1200px; margin:0 auto 80px; padding:26px clamp(20px, 4vw, 56px); display:flex; flex-wrap:wrap; align-items:center; gap:14px 26px }
.managed .lab { font-size:15px; color:var(--muted) }
.managed .pill { text-decoration:none; padding:8px 18px; border-radius:999px; font-size:15px; border:1px solid var(--line); color:var(--muted); transition:all .4s ease }
.managed .pill.on { background:var(--red); border-color:var(--red); color:#fff }
.managed .what { flex:1 1 280px; font-size:15px }
.rule { max-width:1088px; margin:0 auto; border-top:1px solid var(--line) }
.fallback { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:40px; z-index:9 }

@media (max-width: 820px) {
  .top nav { display:none }
  .tour { margin-left:auto }
  .hud { top:calc(env(safe-area-inset-top, 0px) + 84px) }
  .stats { gap:12px 22px }
  .stats div { min-width:42% }
  .side { font-size:14px; letter-spacing:.2em; top:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 130px); transform:none }
  .side.left { left:12px } .side.right { right:12px }
  .details { grid-template-columns:1fr; gap:40px }
  .sols { grid-template-columns:1fr }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto } .fade { transition:opacity .2s ease } .sols li { animation:none } }
</style>
</head>

    });
    spinV *= Math.pow(0.05, dt);
    const settle = Math.max(0, 1 - Math.abs(target - pos) * 3);
    orbit.position.set(0, cy, 0);
    orbit.scale.setScalar(base / 1.95);
    orbitMats.forEach(m => { m.opacity = 0.16 * settle; });
    beltMat.opacity = 0.45 * settle;
    belt.rotation.z = t * 0.015 * (reduce ? 0.2 : 1);
    const cnt = D[cur].ab.length;
    moons.forEach((m, i) => {
      const el = moonEls[i];
      if (i >= cnt) { m.mesh.visible = false; el.style.opacity = 0; return; }
      m.mesh.visible = true;
      const k = i % 3, per = Math.ceil((cnt - k) / 3), idx = Math.floor(i / 3);
      const ang = idx / per * Math.PI * 2 + k * 1.1 + t * ORB[k][1] * (reduce ? 0.2 : 1);
      m.mesh.position.set(Math.cos(ang) * ORB[k][0], Math.sin(ang) * ORB[k][0], 0);
      m.mat.opacity = settle;
      m.mesh.getWorldPosition(v);
      const behind = v.z < -0.2 && Math.hypot(v.x, v.y - cy) < base * 1.02;
      v.project(camera);
      el.style.transform = 'translate(' + ((v.x + 1) / 2 * hero.clientWidth + 12).toFixed(1) + 'px,' + ((1 - v.y) / 2 * hero.clientHeight - 12).toFixed(1) + 'px)';
      el.style.opacity = (behind ? 0 : settle).toFixed(2);
    });
    stars.rotation.y = t * 0.004;
    camera.position.x = Math.sin(t * 0.12) * 0.15;
    camera.position.y = Math.cos(t * 0.1) * 0.1;
    camera.lookAt(0, cy * 0.3, 0);
    if (touring) { tourT += dt; if (tourT > 8) { tourT = 0; go((cur + 1) % N); } }
    else { idle += dt; if (idle > 30) { idle = 0; startTour(); } }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
