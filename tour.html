<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberGenics – Managed Security Services tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
@property --acc { syntax:'<color>'; inherits:true; initial-value:#E8261C }
:root {
  --space:#04050D; --frost:#EAF0FA; --muted:#94A3BF; --red:#E8261C; --blue:#4A86F0; --pale:#D6DEEC;
  --line:color-mix(in srgb, var(--frost) 13%, transparent); --card:color-mix(in srgb, var(--frost) 4%, transparent);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --space:#04050D; --frost:#EAF0FA; } }
:root[data-theme="dark"] { --space:#04050D; --frost:#EAF0FA; }
*, *::before, *::after { box-sizing:inherit }
html, body { height:100%; margin:0; overflow:hidden; background:var(--space); color:var(--frost); font-family:'Sora', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing:antialiased }
html { scroll-padding-top:env(safe-area-inset-top, 0px) }
body { --acc:var(--red); transition:--acc 1.2s ease }
body[data-ch="2"] { --acc:var(--blue) }
body[data-ch="3"] { --acc:var(--pale) }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer }
button:focus-visible, a:focus-visible { outline:2px solid #6EA0FF; outline-offset:3px; border-radius:8px }
a { color:inherit }
#bg { position:fixed; inset:0; width:100%; height:100%; display:block }
.veil { position:fixed; inset:0; background:linear-gradient(90deg, color-mix(in srgb, var(--space) 78%, transparent) 0%, color-mix(in srgb, var(--space) 30%, transparent) 55%, transparent 80%); pointer-events:none }

.top { position:fixed; left:0; right:0; top:0; z-index:5; display:flex; align-items:center; gap:24px; padding:calc(env(safe-area-inset-top, 0px) + 24px) clamp(20px, 4vw, 56px) 0 }
.top img { width:118px; display:block }
.chapters { display:flex; align-items:center; gap:6px; margin:0 auto; padding:6px; border:1px solid var(--line); border-radius:999px; background:color-mix(in srgb, var(--space) 60%, transparent); backdrop-filter:blur(8px) }
.chapters button { min-height:44px; padding:10px 18px; border-radius:999px; font-size:14px; color:var(--muted); display:flex; align-items:center; gap:8px; transition:background .6s ease, color .6s ease }
.chapters button b { font-weight:400; font-size:12px; opacity:.7 }
.chapters button[aria-current="true"] { background:var(--acc); color:#fff }
body[data-ch="3"] .chapters button[aria-current="true"] { color:var(--space) }
.tour { font-size:14px; min-height:44px; padding:10px 20px; border:1px solid var(--line); border-radius:999px; white-space:nowrap }
.tour[aria-pressed="true"] { border-color:var(--red); background:color-mix(in srgb, var(--red) 18%, transparent) }

.stage { position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top, 0px) + 110px); bottom:calc(env(safe-area-inset-bottom, 0px) + 74px); z-index:3 }
.ch { position:absolute; inset:0; max-width:1320px; margin:0 auto; padding:24px clamp(20px, 4vw, 56px) 0; visibility:hidden; display:flex; flex-direction:column; gap:44px; overflow:auto }
.ch.vis { visibility:visible }
.ch { scrollbar-width:none; -ms-overflow-style:none }
.ch::-webkit-scrollbar { display:none; width:0; height:0 }
@media (max-height: 960px) {
  .stage { top:calc(env(safe-area-inset-top, 0px) + 96px) }
  .ch { gap:28px; padding-top:12px }
  h1 { font-size:clamp(36px, 4.2vw, 60px) }
  .sub { font-size:16px; margin-top:10px }
  .beat { gap:9px }
  .beat .node { width:50px; height:50px }
  .beats::before, .beats .fill { top:25px; left:25px }
  .beat .bd { font-size:14px; line-height:1.5 }
  .chips { padding-top:16px }
  .chips span { padding:10px 16px; font-size:15px }
}
.ch [data-a] { opacity:0; transform:translateY(22px); filter:blur(10px); transition:opacity .8s ease, transform 1s var(--ease), filter .8s ease; transition-delay:calc(var(--d, 0) * 110ms + .2s) }
.ch.on [data-a] { opacity:1; transform:none; filter:none }
.ch.leave [data-a] { opacity:0; transform:translateY(-16px); filter:blur(10px); transition-duration:.5s, .6s, .5s; transition-delay:calc(var(--d, 0) * 35ms) }

.kick { font-size:15px; color:var(--acc); margin:0 0 12px }
h1 { margin:0; font-weight:300; font-size:clamp(40px, 5.4vw, 76px); line-height:1.02; letter-spacing:-.03em; max-width:16ch }
.sub { margin:16px 0 0; font-size:18px; line-height:1.55; color:var(--muted); max-width:46ch }
.headrow { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px 40px }

.why { display:grid; grid-template-columns:minmax(0, .9fr) minmax(0, 1.1fr); gap:56px; align-items:center; height:100% }
.reasons { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px }
.reason { padding:22px 22px 20px; border-radius:18px; background:var(--card); border:1px solid var(--line); display:flex; flex-direction:column; gap:8px; backdrop-filter:blur(6px); transition:border-color .6s ease, background .6s ease }
.reason i { font-style:normal; font-size:13px; color:#FF8A7A }
.reason span { font-size:20px; line-height:1.3 }
.reason small { font-size:14px; color:#C9D3E6 }
.reason.hot { background:color-mix(in srgb, var(--red) 12%, transparent); border-color:color-mix(in srgb, var(--red) 60%, transparent) }
.reason.now { border-color:color-mix(in srgb, var(--frost) 55%, transparent) }

.beats { position:relative; list-style:none; margin:0; padding:0; display:grid; gap:28px }
.beats::before { content:''; position:absolute; left:30px; right:30px; top:30px; height:2px; background:var(--line) }
.beats .fill { position:absolute; left:30px; top:30px; height:2px; width:calc((100% - 60px) * var(--p, 0)); background:linear-gradient(90deg, var(--acc), color-mix(in srgb, var(--acc) 50%, var(--frost))); box-shadow:0 0 14px var(--acc); transition:width 1s var(--ease) }
.beat { position:relative; display:flex; flex-direction:column; gap:12px; cursor:pointer; text-align:left; padding:0; color:inherit }
.beat .node { width:60px; height:60px; border-radius:50%; display:grid; place-items:center; font-size:17px; background:var(--space); border:2px solid color-mix(in srgb, var(--acc) 45%, transparent); transition:all .7s var(--ease) }
.beat.done .node { border-color:var(--acc) }
.beat.now .node { background:color-mix(in srgb, var(--acc) 25%, var(--space)); border-color:var(--acc); box-shadow:0 0 0 8px color-mix(in srgb, var(--acc) 18%, transparent), 0 0 34px var(--acc); transform:scale(1.06) }
.beat .bt { font-size:14px; color:var(--muted); transition:color .6s ease }
.beat .bs { font-size:clamp(19px, 1.75vw, 27px); font-weight:600; line-height:1.22; color:var(--frost); transition:color .6s ease, text-shadow .6s ease }
.beat.now .bs { text-shadow:0 0 22px color-mix(in srgb, var(--acc) 60%, transparent) }
.beat.now .bt { color:var(--acc) }
.beat .bd { font-size:15px; line-height:1.6; color:var(--muted); max-width:34ch; transition:color .6s ease }
.beat.now .bd { color:var(--frost) }
.beat:not(.now):not(.done) .bs { color:color-mix(in srgb, var(--frost) 72%, var(--space)) }

.chips { display:flex; flex-wrap:wrap; gap:12px; padding-top:24px; border-top:1px solid var(--line) }
.chips span { padding:12px 20px; border-radius:14px; font-size:16px; background:color-mix(in srgb, var(--frost) 6%, transparent) }
.chips span:first-child { background:color-mix(in srgb, var(--acc) 18%, transparent) }
.chips b { font-weight:600 }

.foot { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; align-items:center; gap:18px; padding:0 clamp(20px, 4vw, 56px) calc(env(safe-area-inset-bottom, 0px) + 28px) }
.bar { flex:1; height:3px; border-radius:3px; background:var(--line); overflow:hidden }
.bar i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--red), var(--blue) 66%, var(--pale)); border-radius:3px }
.next { font-size:14px; color:var(--muted); white-space:nowrap; min-height:44px; padding:10px 4px; transition:color .3s ease }
.next:hover { color:var(--frost) }

@media (max-width: 900px) {
  .chapters button span { display:none }
  .chapters button b { font-size:14px; opacity:1 }
  .top img { width:92px }
  .why { grid-template-columns:1fr; gap:28px }
  .reasons { grid-template-columns:1fr }
  .beats { grid-template-columns:1fr !important; gap:20px }
  .beats::before, .beats .fill { display:none }
  .beat { flex-direction:row; align-items:flex-start; gap:16px }
  .beat .node { flex:none; width:48px; height:48px }
  .veil { background:color-mix(in srgb, var(--space) 70%, transparent) }
}
@media (prefers-reduced-motion: reduce) {
  .ch [data-a], .ch.leave [data-a] { transform:none; filter:none; transition:opacity .3s ease; transition-delay:0s }
  body { transition:none }
}
</style>
</head>

  const DUR = [12, 17, 13, 15];
  const TOTAL = DUR.reduce((a, b) => a + b, 0);

  const $ = id => document.getElementById(id);

  const rs = $('reasons');

  const sections = Array.from(document.querySelectorAll('.ch'));
  const beatEls = [[]];
  CH.forEach((c, k) => {

    const sb = el('p', 'sub', c.sub); sb.setAttribute('data-a', ''); sb.style.setProperty('--d', 2);

    const chips = el('div', 'chips'); chips.setAttribute('data-a', ''); chips.style.setProperty('--d', 4 + c.beats.length);

  const nav = $('chapters');
  const navBtns = CH.map((c, k) => {

  let cur = -1, beat = 0, beatT = 0, holdT = 0, leaveT = null;
  function setBeat(k, i) {

    const bs = beatEls[k];
    bs.forEach((b, j) => { b.classList.toggle('now', j === i); b.classList.toggle('done', j < i); });
    bs[0].closest('ol').style.setProperty('--p', bs.length > 1 ? (i / (bs.length - 1)).toFixed(3) : 1);
  }
  function go(k) {
    if (k === cur) return;
    const prev = cur; cur = k;

    navBtns.forEach((b, i) => b.setAttribute('aria-current', i === k ? 'true' : 'false'));
    $('nextBtn').textContent = 'Next: ' + CH[(k + 1) % 4].name;

    const n = sections[k];
    n.classList.remove('leave'); n.classList.add('vis');
    requestAnimationFrame(() => requestAnimationFrame(() => n.classList.add('on')));
    setBeat(k, 0);
    if (k > 0) beatEls[k][0].closest('ol').style.setProperty('--p', 0);
    mode = k;
    try { history.replaceState(null, '', '#' + ['why', 'protect', 'defense', 'risk'][k]); } catch (e) {}
  }
  $('nextBtn').addEventListener('click', () => { stopTour(); go((cur + 1) % 4); });

  let touring = false, tourT = 0, idle = 0;
  const tourBtn = $('tourBtn');
  function startTour() { touring = true; tourT = 0; tourBtn.setAttribute('aria-pressed', 'true'); tourBtn.textContent = 'Stop tour'; if (cur !== 0) go(0); else setBeat(0, 0); }
  function stopTour() { if (!touring) return; touring = false; tourBtn.setAttribute('aria-pressed', 'false'); tourBtn.textContent = 'Start tour'; }
  tourBtn.addEventListener('click', () => { idle = 0; if (touring) stopTour(); else startTour(); });
  ['pointermove', 'pointerdown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, () => { idle = 0; }, { passive: true }));
  let sx = null, sy = 0;
  $('stage').addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
  addEventListener('pointerup', e => { if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) { stopTour(); go((cur + (dx < 0 ? 1 : 3)) % 4); } });
  addEventListener('keydown', e => { idle = 0; if (e.key === 'ArrowRight') { stopTour(); go((cur + 1) % 4); } if (e.key === 'ArrowLeft') { stopTour(); go((cur + 3) % 4); } });

  // ---------- particle background ----------
  const cv = $('bg'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function size() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  size(); addEventListener('resize', size);
  const NP = 460, G = 2.39996;
  const P = []; for (let i = 0; i < NP; i++) P.push({ x: W * Math.random(), y: H * Math.random(), c: [234, 240, 250] });
  const STARS = []; for (let i = 0; i < 160; i++) STARS.push([Math.random(), Math.random(), Math.random() * 1.2 + 0.3, Math.random()]);
  const COL = { red: [232, 38, 28], blue: [74, 134, 240], pale: [214, 222, 236], soft: [255, 138, 122] };
  const SH = [[0, -1], [0.78, -0.68], [0.78, 0.05], [0.55, 0.62], [0, 1.02], [-0.55, 0.62], [-0.78, 0.05], [-0.78, -0.68], [0, -1]];
  const shLen = []; let shTot = 0; for (let i = 1; i < SH.length; i++) { const l = Math.hypot(SH[i][0] - SH[i - 1][0], SH[i][1] - SH[i - 1][1]); shLen.push(l); shTot += l; }
  function shieldPt(u) { let d = u * shTot; for (let i = 0; i < shLen.length; i++) { if (d <= shLen[i]) { const f = d / shLen[i]; return [SH[i][0] + (SH[i + 1][0] - SH[i][0]) * f, SH[i][1] + (SH[i + 1][1] - SH[i][1]) * f]; } d -= shLen[i]; } return SH[0]; }
  const hash = n => { const h = Math.sin(n * 91.7) * 43758.5; return h - Math.floor(h); };
  let mode = 0, wM = [1, 0, 0, 0];
  function target(m, i, t, cx, cy, R) {
    if (m === 0) {
      const k = i % 3, rx = R * (1.2 - k * 0.2), ry = R * (0.4 + k * 0.2), rot = [-0.3, 0.5, 1.25][k], a = i * G + t * 0.12 * (k === 1 ? -1 : 1);
      const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
      return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot), [COL.red, COL.blue, COL.pale][k]];
    }
    if (m === 1) {
      if (i < NP * 0.7) { const u = ((i / (NP * 0.7)) + t * 0.01) % 1, p = shieldPt(u), br = 1 + 0.015 * Math.sin(t * 2 + i), j = (hash(i) - 0.5) * 0.05; return [cx + p[0] * R * 0.95 * br + j * R, cy + p[1] * R * 0.95 * br + j * R, hash(i + 3) > 0.8 ? COL.soft : COL.red]; }
      const a = hash(i) * 6.283, r = R * (0.25 + 0.55 * hash(i + 7)); return [cx + Math.cos(a) * r * 0.6, cy + Math.sin(a) * r * 0.75, COL.red];
    }
    if (m === 2) {
      const k = i % 4, r = R * (0.3 + 0.24 * k), a = i * G + t * 0.03 * (k % 2 ? 1 : -1);
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r, k === 0 ? COL.pale : COL.blue];
    }
    const cols = 22, rows = 14, c = i % cols, r = Math.floor(i / cols) % rows, s = R * 0.11;
    const x = cx + (c - (cols - 1) / 2) * s, y = cy + (r - (rows - 1) / 2) * s * 0.8;
    const scan = cx - R * 1.4 + ((t * 0.12) % 1) * R * 2.8, flagged = hash(c * 31 + r * 7) > 0.86, fixed = x < scan;
    return [x, y, flagged && !fixed ? COL.red : COL.pale];
  }
  const sparks = []; for (let i = 0; i < 26; i++) sparks.push([Math.random(), Math.random() * 0.8 + 0.1]);
  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    const narrow = W < 900, side = mode > 0 && !narrow, cx = narrow ? W * 0.5 : W * (side ? 0.8 : 0.72), cy = narrow ? H * 0.3 : H * (side ? 0.33 : 0.48), R = Math.min(W, H) * (narrow ? 0.28 : (side ? 0.23 : 0.3));
    for (let m = 0; m < 4; m++) wM[m] += ((m === mode ? 1 : 0) - wM[m]) * Math.min(1, dt * 2.2);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    STARS.forEach(s => { ctx.fillStyle = 'rgba(234,240,250,' + (0.25 + 0.35 * Math.sin(t * 0.8 + s[3] * 10) ** 2).toFixed(3) + ')'; ctx.fillRect(s[0] * W, s[1] * H, s[2], s[2]); });
    const k = Math.min(1, dt * (reduce ? 6 : 2.2));
    for (let i = 0; i < NP; i++) {
      const p = P[i], tg = target(mode, i, t, cx, cy, R);
      p.x += (tg[0] - p.x) * k; p.y += (tg[1] - p.y) * k;
      for (let c = 0; c < 3; c++) p.c[c] += (tg[2][c] - p.c[c]) * k;
      const rgb = Math.round(p.c[0]) + ',' + Math.round(p.c[1]) + ',' + Math.round(p.c[2]);
      ctx.fillStyle = 'rgba(' + rgb + ',0.08)'; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(' + rgb + ',0.85)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, 6.283); ctx.fill();
    }
    if (wM[1] > 0.02) {
      sparks.forEach((s, i) => {
        const ph = (t * 0.35 + s[0]) % 1, y = cy + (s[1] - 0.5) * R * 1.6, hitX = cx - R * 0.78;
        let x, a;
        if (ph < 0.7) { x = cx - R * 3 + (hitX - (cx - R * 3)) * (ph / 0.7); a = 1; } else { const q = (ph - 0.7) / 0.3; x = hitX - q * R * 0.6; a = 1 - q; }
        ctx.fillStyle = 'rgba(255,90,70,' + (a * wM[1] * 0.9).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(x, y, 3, 0, 6.283); ctx.fill();
        ctx.fillStyle = 'rgba(255,90,70,' + (a * wM[1] * 0.15).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(x, y, 10, 0, 6.283); ctx.fill();
      });
    }
    if (wM[2] > 0.02) {
      const a = t * 1.2, g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.05);
      g.addColorStop(0, 'rgba(74,134,240,' + (0.25 * wM[2]).toFixed(3) + ')'); g.addColorStop(1, 'rgba(74,134,240,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R * 1.05, a - 0.6, a); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(143,180,255,' + (0.7 * wM[2]).toFixed(3) + ')'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R * 1.05, cy + Math.sin(a) * R * 1.05); ctx.stroke();
      [[0.6, 0.9], [-0.4, 0.55], [2.2, 0.75]].forEach((b, i) => {
        const d = ((a - b[0]) % 6.283 + 6.283) % 6.283, glow = Math.max(0, 1 - d / 2.5);
        const bx = cx + Math.cos(b[0]) * R * b[1], by = cy + Math.sin(b[0]) * R * b[1];
        ctx.fillStyle = (i === 0 ? 'rgba(255,90,70,' : 'rgba(143,180,255,') + (glow * wM[2]).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(bx, by, 5, 0, 6.283); ctx.fill();
      });
    }
    if (wM[3] > 0.02) {
      const scan = cx - R * 1.4 + ((t * 0.12) % 1) * R * 2.8;
      const g = ctx.createLinearGradient(scan - 60, 0, scan, 0);
      g.addColorStop(0, 'rgba(214,222,236,0)'); g.addColorStop(1, 'rgba(214,222,236,' + (0.35 * wM[3]).toFixed(3) + ')');
      ctx.fillStyle = g; ctx.fillRect(scan - 60, cy - R * 0.75, 60, R * 1.5);
    }
    ctx.globalCompositeOperation = 'source-over';

    if (cur > 0 || cur === 0) {
      const n = cur === 0 ? reasonEls.length : beatEls[cur].length, per = cur === 0 ? 1.7 : (DUR[cur] - 2) / n;
      if (holdT > 0) holdT -= dt;
      else { beatT += dt; if (beatT > per) { const nb = beat + 1; if (nb < n) setBeat(cur, nb); else if (!touring) setBeat(cur, 0); else beatT = 0; } }
    }
    let prog;
    if (touring) {
      tourT += dt;
      if (tourT > DUR[cur]) { tourT = 0; go((cur + 1) % 4); }
      prog = (DUR.slice(0, cur).reduce((a, b) => a + b, 0) + Math.min(tourT, DUR[cur])) / TOTAL;
    } else {
      idle += dt; if (idle > 30) { idle = 0; startTour(); }
      prog = (cur + 1) / 4;
    }
    barNow += (prog - barNow) * Math.min(1, dt * 3);
    $('barFill').style.width = (barNow * 100).toFixed(2) + '%';
    requestAnimationFrame(frame);
  }
  let barNow = 0;
  const hk = ['why', 'protect', 'defense', 'risk'].indexOf((location.hash || '').slice(1));
  go(hk >= 0 ? hk : 0);
  requestAnimationFrame(frame);
})();
